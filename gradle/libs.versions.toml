[versions]
# 构建工具与插件
agp = "9.2.1"
appcompat = "1.7.1"
kotlin = "2.4.0"
ksp = "2.3.4"

# 核心基础库
coreKtx = "1.19.0"
lifecycle = "2.10.0"
activity = "1.13.0"
navigation = "1.1.2"
datastore = "1.2.1"
desugar = "2.1.5"

# Compose 相关版本
composeBom = "2026.05.01"
materialIcons = "1.7.8"
accompanist = "0.37.3"

# 依赖注入
hilt = "2.59.2"
hiltNavigation = "1.3.0"

# 媒体与相机
coil = "3.4.0"
coilZoomable = "0.19.0"
camera = "1.6.1"
exifinterface = "1.4.2"

# 业务逻辑与数据
room = "3.0.0-alpha06"
serialization = "1.11.0"
webrtc = "144.7559.05"
mlkit = "17.3.0"
zxing = "3.5.4"
pinyin = "0.4.0"

# 测试与辅助工具
junit = "4.13.2"
junitExt = "1.3.0"
espresso = "3.7.0"
annotations = "26.1.0"

[libraries]
# 核心支持库
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
desugar-jdk = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# 生命周期与导航
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
navigation-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation" }
navigation-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation" }

# Jetpack Compose UI 组件
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-adaptive = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }
compose-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIcons" }

# 依赖注入 (Hilt)
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }

# 数据库 (Room)
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }

# 图片加载与网络媒体
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
coil-network = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-video = { module = "io.coil-kt.coil3:coil-video", version.ref = "coil" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
coil-zoomable = { module = "me.saket.telephoto:zoomable-image-coil3", version.ref = "coilZoomable" }
webrtc = { module = "io.github.webrtc-sdk:android", version.ref = "webrtc" }

# 相机与扫码
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# 其他功能库
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
pinyin = { module = "com.github.houbb:pinyin", version.ref = "pinyin" }
permissions-accompanist = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }

# 测试相关
test-junit = { group = "junit", name = "junit", version.ref = "junit" }
test-junit-ext = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room3", version.ref = "room" }

[bundles]
# 常用的 Compose UI 核心包
compose = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-material3",
    "compose-material3-adaptive",
    "compose-activity",
    "lifecycle-runtime",
    "lifecycle-viewmodel-compose",
    "lifecycle-viewmodel-navigation3"
]
# Coil 图片加载全家桶
coil = ["coil-compose", "coil-gif", "coil-network", "coil-video"]
# CameraX 核心包
camera = ["camera-camera2", "camera-lifecycle", "camera-view"]